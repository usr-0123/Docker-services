# Root orchestrator.
# Each database is now a self-contained stack in its own folder and can be
# run independently, e.g.:
#     cd postgres && docker compose up -d
#     cd mongoDb  && docker compose up -d
#     cd mssql    && docker compose up -d
#
# This root file simply pulls all three together so you can also run
# `docker compose up -d` from here to start everything at once.
include:
  - postgres/docker-compose.yml
  - mongoDb/docker-compose.yml
  - mssql/docker-compose.yml
